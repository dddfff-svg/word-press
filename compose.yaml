name: daily-blog
services:
  blog:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3080}
    image: daily-blog:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      JOURNAL_STORAGE: server
      JOURNAL_DATA_DIR: /app/storage
      SITE_URL: ${SITE_URL:-http://localhost:3080}
      SPARK_PUBLIC_URL: ${SPARK_PUBLIC_URL:-}
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      SESSION_SECRET_FILE: /run/secrets/session_secret
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BLOG_PORT:-3080}:3000"
    volumes:
      - journal-data:/app/storage
    secrets:
      - admin_password_hash
      - session_secret
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  admin_password_hash:
    file: ./.secrets/admin_password_hash
  session_secret:
    file: ./.secrets/session_secret
volumes:
  journal-data:

